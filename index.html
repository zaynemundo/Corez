    <!-- Fonts are self-hosted as variable woff2 subsets (see src/fonts.css):
         no third-party stylesheet, no extra DNS/TLS handshakes, and the files
         are content-hashed under /assets so they cache immutably. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("corez_theme");
          var theme = t === "light" || t === "dark" ? t : "dark";
          document.documentElement.setAttribute("data-theme", theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "light" ? "#ffffff" : "#0a0a0a");
          // Interface language decides direction before the first paint, so an
          // Arabic session never flashes a left-to-right layout. Kept in sync
          // with src/i18n (same storage key and supported ids).
          var l = localStorage.getItem("corez_language");
          if (l === "ar") {
            document.documentElement.setAttribute("lang", "ar");
            document.documentElement.setAttribute("dir", "rtl");
          } else {
            document.documentElement.setAttribute("lang", "en");
            document.documentElement.setAttribute("dir", "ltr");
          }
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
          document.documentElement.setAttribute("dir", "ltr");
        }
      })();
    </script>
