name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

jobs:
  # Fast feedback lane: lint, unit tests, and the production build. Contract
  # suites run in parallel so a unit regression never waits on the slower
  # hosted-worker contracts.
  verify-fast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run unit test suite
        run: npm test

      - name: Run build
        run: npm run build

  verify-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run hosted AI contract suite
        run: npm run test:cloudflare

  deploy:
    needs: [verify-fast, verify-contracts]
    runs-on: ubuntu-latest
    environment: production
    concurrency: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Upload Worker version
        # Custom domains are provisioned separately with a zone-enabled token.
        # Code releases use versions so this Worker-only token never resyncs routes.
        run: npx wrangler versions upload --tag "${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}" --message "GitHub ${GITHUB_SHA} attempt ${GITHUB_RUN_ATTEMPT}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker version
        run: npx wrangler versions deploy --version-tag "${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}" --message "GitHub ${GITHUB_SHA} attempt ${GITHUB_RUN_ATTEMPT}" --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
