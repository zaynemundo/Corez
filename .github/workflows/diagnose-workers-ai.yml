name: Diagnose Workers AI

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-workers-ai.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Call GLM-4.7-Flash directly
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/run/@cf/zai-org/glm-4.7-flash" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data '{"messages":[{"role":"system","content":"You are a concise assistant."},{"role":"user","content":"Reply with exactly: working"}]}')"
          printf 'Workers AI HTTP status: %s\n' "$status"
          node - "$response_file" <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          console.log(JSON.stringify({
            success: payload.success,
            errors: payload.errors,
            result: payload.result
          }));
          NODE
