name: Diagnose Workers AI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-workers-ai.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Call GLM-5.2 through the Workers AI REST API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/run/@cf/zai-org/glm-5.2" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data '{"messages":[{"role":"user","content":"Reply with exactly: working"}]}')"
          printf 'Workers AI HTTP status: %s\n' "$status"
          node - "$response_file" <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          console.log(JSON.stringify({
            success: payload.success,
            errors: payload.errors,
            resultType: payload.result == null ? null : typeof payload.result
          }));
          NODE

      - name: Capture the deployed Worker's sanitized AI error
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          tail_file="$(mktemp)"
          timeout 90s npx --yes wrangler@4.112.0 tail ai --format json >"$tail_file" 2>&1 &
          tail_pid=$!
          for attempt in $(seq 1 30); do
            if grep -q 'Successfully created tail' "$tail_file"; then
              break
            fi
            if ! kill -0 "$tail_pid" 2>/dev/null; then
              sed -n '1,240p' "$tail_file"
              exit 1
            fi
            sleep 2
          done
          grep -q 'Successfully created tail' "$tail_file"
          curl --silent --show-error \
            --request POST \
            'https://ai.zayne-mayo.workers.dev/api/ai' \
            --header 'Content-Type: application/json' \
            --data '{"prompt":"Reply with exactly: working","intent":{"type":"general","summary":"Test hosted text generation."}}'
          printf '\n'
          sleep 5
          kill "$tail_pid" 2>/dev/null || true
          wait "$tail_pid" || true
          sed -n '1,240p' "$tail_file"
